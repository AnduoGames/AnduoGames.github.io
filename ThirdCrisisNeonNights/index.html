<!doctype html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Play:wght@400;700&family=Rubik+Glitch&family=Zen+Dots&display=swap" rel="stylesheet">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Third Crisis: Neon Nights">
    <meta property="og:description" content="Dive into a cyberpunk metropolis as the mercenary, Zoey Madison. Find a way to navigate the seductive and corrupt Neon City. Wishlist on Steam or play on itch.io.">
    <meta property="og:url" content="https://anduogames.github.io/ThirdCrisisNeonNights/index.html">
    <meta property="og:image" content="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3400350/5d968d01e89007bf7bedd210e3d566a6bfdd2565/header.jpg?t=1771419353">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Third Crisis: Neon Nights">
    <meta name="twitter:description" content="Dive into a cyberpunk metropolis as the mercenary, Zoey Madison. Find a way to navigate the seductive and corrupt Neon City. Wishlist on Steam or play on itch.io.">
    <meta name="twitter:image" content="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/3400350/5d968d01e89007bf7bedd210e3d566a6bfdd2565/header.jpg?t=1771419353">
    
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Open in Steam</title>
  <style>
    :root { --w: min(980px, 92vw); }
    body {
      margin: 0;
      min-height: 100vh;
      color: #fff;
      background: #0b1020;
      display: grid;
      place-items: center;
      font-family: "Play", sans-serif;
      font-weight: 400;
      font-style: normal;
    }
    .bg {
      position: fixed;
      inset: 0;
      background-image: url("SLP_background3.jpg");
      background-repeat: no-repeat;
      background-color: #020305;
      background-position-x: center;
      /*background:
        radial-gradient(1200px 600px at 50% 0%, rgba(0, 153, 255, 0.20), transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,0.65), rgba(0,0,0,0.85));*/
      pointer-events: none;
    }
    .wrap {
      width: var(--w);
      display: grid;
      gap: 18px;
      padding: 28px 0;
    }
    .card {
      background: rgba(20, 26, 44, 0.75);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 16px 60px rgba(0,0,0,0.45);
    }
    .banner {
      position: relative;
      aspect-ratio: 16/3.5;
      background: #111;
      overflow: hidden;
    }
    /* Steam widget uses its own styling; this is a “banner behind popup” effect */
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .content {
      padding: 18px 18px 16px;
      display: grid;
      gap: 12px;
    }
    h1 { font-size: 18px; margin: 0; }
    p { margin: 0; opacity: 0.9; line-height: 1.35; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    button, a.btn {
      appearance: none;
      border: 0;
      /*border-radius: 12px;
      padding: 11px 14px;*/
      padding: 6px 10px 20px 10px;
      margin-right: 10px;
      width: 212px;
      height: 48px;
      cursor: pointer;
      text-decoration: none;
      /*display: inline-flex;*/
      align-items: center;
      gap: 10px;
      user-select: none;
      background-color: rgba(255,255,255,0);
      font-family: "Play", sans-serif;
      font-weight: 400;
      font-style: normal;
      font-size: 24px;
      background-image: url("SLP_button_base.png"); 
      color: #ffffff; 
    }
    button:hover, a.btn:hover {
      background-image: url("SLP_button_hover.png");
    }
    button.primary { }
    a.btn.secondary {  }
    a.btn.itchio { }
    .fineprint { font-size: 12px; opacity: 0.8; }
    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background: rgba(255,255,255,0.10);
      padding: 2px 6px;
      border-radius: 6px;
    }
    .centered {
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="bg"></div>

  <div class="wrap">
    <div class="card">
      <div class="banner">
        <!-- Steam store widget (nice “wishlist banner” effect) -->
        <!-- Replace APPID below -->
        <iframe
          src="https://store.steampowered.com/widget/3400350/"
          loading="eager"
          referrerpolicy="no-referrer-when-downgrade"
          title="Steam Widget">
        </iframe>
      </div>

      <div class="content">
        <!--<h1>Open in the Steam client (recommended)</h1>-->
        <p>
          Your browser will ask for permission to open Steam. 
          <br>
          Click <span class="kbd">Open Steam</span> to continue.
          If you cancel, you can still use the store links below.
          <br>
          <br>
          </p>
        <p class="centered">
          <button class="primary" type="button" onclick="openSteam()">Open in Steam</button>
          <button class="btn secondary" onclick="window.location.href='https://store.steampowered.com/app/3400350'" rel="noopener">Steam Webstore</button>
          <button class="btn itchio" onclick="window.location.href='https://anduogames.itch.io/third-crisis-neon-nights'" rel="noopener">itch.io</button>
        </p>
        <div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const APP_ID = "3400350";
    const steamUrl = `steam://store/${APP_ID}`;

    function openSteam() {
      // No timeout, no auto-fallback — just attempt to open the client.
      window.location.href = steamUrl;
    }

    //openSteam();
  </script>
</body>
</html>
